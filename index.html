<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奇美友善醫療嘉年華 | Chi Mei Friendly Medical Carnival</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#0e7aa8',
              dark: '#145c74',
              light: '#3ea8d6',
            },
            secondary: {
              DEFAULT: '#e0c23a',
              light: '#f4d03f',
            },
            neutral: {
              50: '#f7f8fb',
              900: '#10212a',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Inter"', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'blob': 'blob 7s infinite',
            'shimmer': 'shimmer 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'gradient-x': 'gradient-x 15s ease infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            shimmer: {
              '100%': { transform: 'translateX(100%)' },
            },
            'gradient-x': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #0e7aa8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #145c74; }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 antialiased selection:bg-primary selection:text-white">
  <div id="root"></div>

  <!-- React App -->
  <script type="text/babel" data-presets="env,react">
    const { createContext, useState, useContext } = React;

    // 翻譯字串
    const translations = {
      zh: {
        heroTag: "Chi Mei Medical Center",
        heroTitlePrefix: "奇美",
        heroTitleSuffix: "友善醫療嘉年華",
        heroSubtitleZh: "跨越兩年的友善醫療旅程",
        heroSubtitleEn: "The 2024-2025 Journey",
        heroDesc: "從 106 到 275 人的共鳴，我們致力於推廣友善醫療與人文關懷。這是一場結合教育、遊戲與電影的年度盛會，讓醫療更有溫度。",
        heroButton: "回顧我們的足跡",
      },
      en: {
        heroTag: "Chi Mei Medical Center",
        heroTitlePrefix: "Chi Mei",
        heroTitleSuffix: "Friendly Medical Carnival",
        heroSubtitleZh: "A Friendly Medical Journey",
        heroSubtitleEn: "Bridging Care & Humanity",
        heroDesc: "From 106 to 275 participants. We are dedicated to promoting friendly medical care and human compassion. An annual carnival combining education, games, and cinema.",
        heroButton: "Explore Our Journey",
      }
    };

    // 簡單 icon placeholder（先確保畫面正常）
    const Icon = ({ className }) => <span className={className}>★</span>;
    const Activity = Icon;
    const ArrowDown = Icon;
    const Globe = Icon;

    // 語系 context
    const LanguageContext = createContext();

    const LanguageProvider = ({ children }) => {
      const [language, setLanguage] = useState('zh');
      const t = translations[language];
      return (
        <LanguageContext.Provider value={{ language, setLanguage, t }}>
          {children}
        </LanguageContext.Provider>
      );
    };

    const useLanguage = () => useContext(LanguageContext);

    const LanguageSwitcher = () => {
      const { language, setLanguage } = useLanguage();
      return (
        <nav className="fixed top-0 left-0 w-full z-50 pointer-events-none">
          <div className="absolute top-6 right-6 pointer-events-auto">
            <button
              onClick={() => setLanguage(language === 'zh' ? 'en' : 'zh')}
              className="group relative bg-white/90 backdrop-blur-md shadow-lg pl-4 pr-5 py-2.5 rounded-full text-primary font-bold text-sm hover:scale-105 transition-all duration-300 flex items-center gap-2 overflow-hidden border border-white/20"
            >
              <div className="absolute inset-0 -translate-x-full group-hover:animate-shimmer bg-gradient-to-r from-transparent via-white/40 to-transparent z-10"></div>
              <Globe className="w-4 h-4 inline-block" />
              <span>{language === 'zh' ? 'English' : '中文'}</span>
            </button>
          </div>
        </nav>
      );
    };

    const Hero = () => {
      const { t } = useLanguage();

      const scrollToContent = () => {
        const nextSection = document.getElementById('content');
        if (nextSection) {
          nextSection.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <section className="relative min-h-[95vh] flex items-center justify-center overflow-hidden bg-neutral-900 text-white">
          {/* 背景 */}
          <div className="absolute inset-0 z-0">
            <div className="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px]"></div>
            <div className="absolute inset-0 bg-gradient-to-br from-neutral-900 via-neutral-900 to-primary-dark/40"></div>
            <div className="absolute top-0 -left-4 w-96 h-96 bg-primary/40 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob"></div>
            <div className="absolute top-0 -right-4 w-96 h-96 bg-secondary/30 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob"></div>
            <div className="absolute -bottom-32 left-20 w-96 h-96 bg-purple-500/30 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob"></div>
            <div className="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent opacity-30 animate-pulse-slow"></div>
          </div>

          {/* 內容 */}
          <div className="container mx-auto px-6 relative z-10 text-center">
            <div className="inline-flex items-center justify-center gap-2 px-4 py-2 bg-white/5 backdrop-blur-md rounded-full mb-8 border border-white/10 animate-fade-in-up hover:bg-white/10 transition-colors cursor-default">
              <Activity className="w-4 h-4 text-secondary animate-pulse inline-block" />
              <span className="text-sm font-mono tracking-wider text-secondary-light uppercase">
                {t.heroTag}
              </span>
            </div>

            <h1 className="text-5xl md:text-7xl lg:text-8xl font-black mb-8 tracking-tight leading-none drop-shadow-2xl animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
              {t.heroTitlePrefix}
              <span className="block md:inline mt-2 md:mt-0 text-transparent bg-clip-text bg-gradient-to-r from-secondary-light via-white to-secondary-light animate-gradient-x bg-[length:200%_auto]">
                {t.heroTitleSuffix}
              </span>
            </h1>

            <div className="text-2xl md:text-3xl font-bold text-neutral-200 mb-8 animate-fade-in-up flex flex-col md:flex-row items-center justify-center gap-2" style={{ animationDelay: '0.2s' }}>
              <span>{t.heroSubtitleZh}</span>
              <span className="hidden md:inline text-neutral-600">|</span>
              <span className="text-xl md:text-2xl font-light text-primary-light">{t.heroSubtitleEn}</span>
            </div>

            <p className="max-w-3xl mx-auto text-lg md:text-xl text-neutral-300 leading-relaxed mb-12 animate-fade-in-up font-light" style={{ animationDelay: '0.3s' }}>
              {t.heroDesc}
            </p>

            <div className="flex flex-col md:flex-row items-center justify-center gap-4 animate-fade-in-up" style={{ animationDelay: '0.4s' }}>
              <button
                onClick={scrollToContent}
                className="group relative overflow-hidden bg-secondary hover:bg-white text-neutral-900 hover:text-primary-dark px-8 py-4 rounded-full font-bold text-lg transition-all duration-300 shadow-[0_0_20px_rgba(224,194,58,0.3)] hover:shadow-[0_0_30px_rgba(255,255,255,0.4)] flex items-center gap-2"
              >
                <div className="absolute inset-0 -translate-x-full group-hover:animate-shimmer bg-gradient-to-r from-transparent via-white/40 to-transparent z-10"></div>
                <span className="relative z-20 flex items-center gap-2">
                  {t.heroButton}
                  <ArrowDown className="w-5 h-5 group-hover:translate-y-1 transition-transform inline-block" />
                </span>
              </button>
            </div>
          </div>
        </section>
      );
    };

    const PlaceholderSection = () => (
      <section id="content" className="py-16 bg-white">
        <div className="container mx-auto px-6 text-center">
          <h2 className="text-2xl font-bold mb-4">這裡可以放 EventPosters / Stats / Film 等區塊</h2>
          <p className="text-neutral-600">
            目前先做最小可運作版本，確認 React 正常 render。之後可以把原本的各個 section 一段一段搬進來。
          </p>
        </div>
      </section>
    );

    const App = () => (
      <LanguageProvider>
        <main className="min-h-screen">
          <LanguageSwitcher />
          <Hero />
          <PlaceholderSection />
        </main>
      </LanguageProvider>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
